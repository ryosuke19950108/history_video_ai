<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>日本最大の古墳はどうやって築かれたのか</title>
<style>

</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Long-form film in the "Lamplit Archive" style (my-styles/lamplit-archive). Canvas 2D, deterministic render(t).
// film.json (tools/build_timeline.py) holds every scene: one sentence, one layout, its parameters (scenes.json, written by
// Claude Code). assets.json places GSI images on the globe so scenes can name places by latitude/longitude.
// Palette, grades and motion come from film.json.style (= config/style.json). Primitives follow Lemo-Opuscar's
// Visual Investigation demo (MIT); the layouts are this style's own.
const W = 1920, H = 1080;
const cv = document.getElementById('c'), x0 = cv.getContext('2d');
let x = x0, FILM, S, C, G, M, A, FR = 0, REC = null, LAYER;
const F = { serif: 'SerifJP', sans: 'SansJP', mono: 'PlexMono, SansJP' };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), ss = k => k * k * (3 - 2 * k), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, lerp = (a, b, k) => a + (b - a) * k;
function rnd(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const IM = {}; let GRAIN = [];
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
async function boot() {
  FILM = await (await fetch('film.json')).json(); A = await (await fetch('assets.json')).json(); window.DUR = FILM.dur;
  S = FILM.style; C = S.palette; G = S.grade; M = S.motion;
  const L = Object.entries(A).map(([k, v]) => load(v.f).then(i => IM[k] = i));
  for (const f of ['700 40px SerifJP', '500 40px SerifJP', '700 40px SansJP', '500 40px SansJP', '500 20px PlexMono']) L.push(document.fonts.load(f));
  await Promise.all(L);
  for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'); const d = gx.createImageData(256, 256); const r = rnd(g * 131 + 5);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 110; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }
  LAYER = [mk(), mk()]; window.READY = true;
}
function mk() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

// ── geography: lat/lon → source pixel of an asset ──
function geo(k, ll) { const a = A[k]; if (!Array.isArray(ll)) return [a.w / 2, a.h / 2]; if (ll.length === 3) return [ll[0], ll[1]];
  const n = 2 ** a.z, fx = (ll[1] + 180) / 360 * n * 256, la = ll[0] * Math.PI / 180, fy = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n * 256; return [fx - a.gx0, fy - a.gy0]; }
const gradeOf = k => { const l = A[k].layer; return l === 'seamlessphoto' ? G.photo : l === 'hillshademap' ? G.terrain : G.old_photo; };

// ── primitives ──
function font(o) { return `${o.w || 500} ${o.s || 24}px ${o.f || F.sans}`; }
function txt(s, X, Y, o = {}) {
  s = String(s); x.save(); x.font = font(o); x.fillStyle = o.c || C.text; x.globalAlpha *= (o.a ?? 1); x.textAlign = o.al || 'left'; x.textBaseline = 'alphabetic'; x.letterSpacing = (o.ls || 0) + 'px';
  if (o.shadow) { x.shadowColor = 'rgba(0,0,0,.9)'; x.shadowBlur = o.shadow; }
  if (x.globalAlpha > .001) x.fillText(s, X, Y); const w = x.measureText(s).width; const vis = x.globalAlpha; x.restore();
  if (REC && o.id && vis > .5) { const sz = o.s || 24, xa = o.al === 'right' ? X - w : o.al === 'center' ? X - w / 2 : X; REC.push({ id: o.id, text: s, x0: xa, y0: Y - sz * .9, x1: xa + w, y1: Y + sz * .25, ...(o.pass ? { pass: true } : {}) }); }
  return w;
}
function tw(s, o = {}) { x.save(); x.font = font(o); x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(String(s)).width; x.restore(); return w; }
function line(a, b, c, d, col, w = 1, dash) { x.save(); x.strokeStyle = col; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function box(X, Y, w, h, col, lw = 1.5, dash) { x.save(); x.strokeStyle = col; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }
function alpha(a, f) { x.save(); x.globalAlpha *= a; f(); x.restore(); }
function grain(X, Y, w, h, a) { if (!GRAIN.length || a <= 0) return; x.save(); x.beginPath(); x.rect(X, Y, w, h); x.clip(); x.globalCompositeOperation = 'overlay'; x.globalAlpha *= a; const g = GRAIN[FR % 6]; for (let gy = Y; gy < Y + h; gy += 256) for (let gx = X; gx < X + w; gx += 256) x.drawImage(g, gx, gy); x.restore(); }
function view(k, f, scale, o = {}) { // camera on one asset; returns source px → screen
  const img = IM[k]; const X = o.X ?? 0, Y = o.Y ?? 0, w = o.w ?? W, h = o.h ?? H, cx = X + w / 2, cy = Y + h / 2;
  const map = (px, py) => [cx + (px - f[0]) * scale, cy + (py - f[1]) * scale];
  x.save(); x.beginPath(); x.rect(X, Y, w, h); x.clip(); fill(X, Y, w, h, C.ground);
  if (img) { x.globalAlpha *= (o.a ?? 1); x.filter = gradeOf(k); const [sx, sy] = map(0, 0); x.drawImage(img, sx, sy, img.width * scale, img.height * scale); x.filter = 'none'; }
  x.restore(); grain(X, Y, w, h, (o.a ?? 1) * G.grain_alpha);
  return map;
}
function scaleFor(k, span, w = W) { return w * A[k].mpp / span; } // span = metres across the frame
function shade(X0, X1, a) { const g = x.createLinearGradient(X0, 0, X1, 0); g.addColorStop(0, `rgba(13,12,11,${a})`); g.addColorStop(1, 'rgba(13,12,11,0)'); x.fillStyle = g; x.fillRect(Math.min(X0, X1), 0, Math.abs(X1 - X0), H); }
function ring(cx, cy, r, k, col = C.red, lw = 3, dash) { if (k <= 0) return; x.save(); x.strokeStyle = col; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.beginPath(); x.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * eo(k)); x.stroke(); x.restore(); }
function kicker(s, X, Y, a, col = C.red, id) { if (!s) return 0; alpha(a, () => fill(X, Y - 15, 4, 18, col)); return txt(s, X + 16, Y, { s: 21, f: F.mono, c: col, ls: 2, a, id }); }
function backdrop(b, u, d) { if (!b) return; const k = b.img; const f = geo(k, b.at); const sc = scaleFor(k, b.span || 1500) * lerp(1, 1.04, ss(seg(u, 0, d))); view(k, f, sc, { a: b.a ?? .14 }); }
function lamp() {
  const [r, g, b] = G.lamp_rgb; const l = x.createRadialGradient(W / 2, H * .44, 0, W / 2, H * .44, H * .62);
  l.addColorStop(0, `rgba(${r},${g},${b},${G.lamp_alpha})`); l.addColorStop(1, `rgba(${r},${g},${b},0)`); x.save(); x.globalCompositeOperation = 'screen'; x.fillStyle = l; x.fillRect(0, 0, W, H); x.restore();
  const v = x.createRadialGradient(W / 2, H * .46, H * .16, W / 2, H * .5, H * .95); v.addColorStop(0, 'rgba(13,12,11,0)'); v.addColorStop(1, `rgba(13,12,11,${G.vignette_edge_alpha})`); x.fillStyle = v; x.fillRect(0, 0, W, H);
}
const rise = (u, at, dur = .45) => eo(seg(u, at, at + dur));
function title(s, u) { // kicker + serif title + optional number block, left column
  const t = s.text || {}; let y = t.y || 330; const k = rise(u, .1);
  if (t.kicker) { kicker(t.kicker, 120, y - 70, k, t.kc ? C[t.kc] : C.red, 'k'); }
  if (t.title) { txt(t.title, 116, y + 10 * (1 - k), { s: t.ts || 92, w: 700, f: F.serif, a: k, id: 'tt' }); line(120, y + 36, lerp(120, 120 + Math.min(520, tw(t.title, { s: t.ts || 92, w: 700, f: F.serif })), rise(u, .3, .6)), y + 36, C.red, 2); y += 140; }
  if (t.caption) { txt(t.caption, 120, y, { s: 28, c: C.dim, a: rise(u, .35), id: 'cap' }); y += 120; }
  if (t.number) { const kk = rise(u, .45); const nw = txt(t.number, 114, y + 8 * (1 - kk), { s: t.ns || 120, w: 700, f: F.serif, c: C.gold, a: kk, id: 'num' }); if (t.unit) txt(t.unit, 126 + nw, y, { s: 44, f: F.mono, c: C.gold, a: kk, id: 'unit' }); y += 90; }
  if (t.note) txt(t.note, 120, y, { s: 22, c: C.dim, a: rise(u, .6), id: 'note' });
}

// Daisen keyhole, traced on daisen_z17 source pixels (schematic, see FACTS.md)
const DAISEN = [[1370, 975], [1430, 950], [1500, 955], [1560, 1000], [1595, 1070], [1595, 1160], [1560, 1230], [1510, 1280], [1470, 1320], [1445, 1400], [1440, 1475], [1150, 1325], [1200, 1290], [1260, 1240], [1300, 1170], [1320, 1080], [1340, 1020]];

// ── layouts ──
const L = {
  photo(u, s, d) { // a camera on a map or photograph; rings, outline and a text column
    const k = s.img, f0 = geo(k, s.at), f1 = s.to ? geo(k, s.to) : f0, p = ss(seg(u, 0, d + .7));
    const sp = s.span || [1500, 1400], sc = scaleFor(k, lerp(sp[0], sp[1], p)), f = [lerp(f0[0], f1[0], p), lerp(f0[1], f1[1], p)];
    const mp = view(k, f, sc); if (s.text) shade(0, 1150, .9);
    if (s.outline) { const kk = eio(seg(u, .5, 2.2)); if (kk > 0) { x.save(); x.strokeStyle = C.teal; x.lineWidth = 3; const pts = DAISEN.map(p => mp(p[0], p[1])); const n = Math.max(2, Math.floor((pts.length + 1) * kk));
      x.beginPath(); x.moveTo(...pts[0]); for (let i = 1; i < n; i++) x.lineTo(...pts[i % pts.length]); x.stroke(); x.restore(); } }
    (s.rings || []).forEach((r, i) => { const [cx, cy] = mp(...geo(k, r.at)); const rad = r.m ? r.m / A[k].mpp * sc : (r.r || 30); const kk = seg(u, .2 + i * .3, .8 + i * .3);
      ring(cx, cy, rad, kk, r.col ? C[r.col] : C.red, 2.5, r.dashed ? [8, 6] : null); if (!r.label) return; const ka = rise(u, .35 + i * .3); const side = r.side || 1, lx = cx + side * (rad + 18);
      txt(r.label, lx, cy - 4, { s: r.ls || 34, w: 700, f: F.serif, al: side > 0 ? 'left' : 'right', a: ka, shadow: 10, id: 'r' + i });
      if (r.sub) txt(r.sub, lx, cy + 28, { s: 18, f: F.mono, c: C.dim, al: side > 0 ? 'left' : 'right', a: ka, shadow: 8, id: 'rs' + i, pass: true }); });
    if (s.scale) { const m = s.scale, len = m / A[k].mpp * sc, ka = rise(u, .4); alpha(ka, () => { line(W - 120 - len, 880, W - 120, 880, C.dim, 2); line(W - 120 - len, 872, W - 120 - len, 888, C.dim, 2); line(W - 120, 872, W - 120, 888, C.dim, 2); });
      txt(m >= 1000 ? `${m / 1000} km` : `${m} m`, W - 120, 862, { s: 18, f: F.mono, c: C.dim, al: 'right', a: ka, id: 'sc', pass: true }); }
    if (s.stamp) { const ka = rise(u, .2); alpha(ka, () => box(W - 470, 96, 350, 54, C.gold, 1.5, [6, 5])); txt(s.stamp, W - 295, 132, { s: 24, f: F.mono, c: C.gold, al: 'center', a: ka, id: 'stamp' }); }
    title(s, u);
  },
  card(u, s, d) { backdrop(s.bg, u, d); const k = rise(u, .05, .4), al = s.center ? 'center' : 'left', X = s.center ? W / 2 : 200;
    if (s.kicker) kicker(s.kicker, s.center ? W / 2 - tw(s.kicker, { s: 21, f: F.mono, ls: 2 }) / 2 - 8 : 204, 400, k, C.red, 'k');
    const lines = Array.isArray(s.lines) ? s.lines : [s.lines]; const fs = s.fs || (lines.length > 1 ? 76 : 92);
    lines.forEach((ln, i) => txt(ln, X, 520 + i * fs * 1.35 - 14 * (1 - k), { s: fs, w: 700, f: F.serif, al, a: rise(u, .05 + i * .1, .4), c: s.gold === i ? C.gold : C.text, id: 'l' + i }));
    const yr = 520 + (lines.length - 1) * fs * 1.35 + 50; if (!s.center) line(204, yr, lerp(204, 520, rise(u, .6, .8)), yr, C.red, 2);
    if (s.sub) txt(s.sub, X, yr + 70, { s: 28, c: C.dim, al, a: rise(u, .25), id: 'sub' });
  },
  chapter(u, s, d) { backdrop(s.bg, u, d); const k = rise(u, .1, .6);
    txt('MYSTERY', 200, 330, { s: 24, f: F.mono, c: C.red, ls: 6, a: k, id: 'm' }); txt(s.num, 200, 470, { s: 150, w: 700, f: F.serif, c: C.gold, a: k, id: 'n' });
    txt(s.title, 200 + tw(s.num, { s: 150, w: 700, f: F.serif }) + 50, 455 - 12 * (1 - k), { s: 84, w: 700, f: F.serif, a: rise(u, .05, .4), id: 't' });
    line(204, 520, lerp(204, 1500, rise(u, .5, .9)), 520, C.red, 2); if (s.sub) txt(s.sub, 204, 590, { s: 30, c: C.dim, a: rise(u, .7), id: 's' });
  },
  mysteries(u, s, d) { // the four questions and how far each is settled; recurs through the film
    backdrop(s.bg || { img: 'daisen_z17', span: 2200, a: .2 }, u, d); const Q = FILM.mysteries; const k0 = rise(u, .1);
    kicker(s.kicker || '4つの謎', 300, 230, k0, C.gold, 'k');
    Q.forEach((q, i) => { const y = 330 + i * 140, st = (s.status || [])[i] || 'open', on = s.focus === i, ka = rise(u, .15 + i * .12) * (s.focus == null || on ? 1 : .72);
      alpha(ka, () => { fill(300, y - 10, 1320, 110, on ? 'rgba(200,162,78,.10)' : 'rgba(23,20,15,.6)'); box(300, y - 10, 1320, 110, on ? C.gold : C.hairline, 1.5); });
      txt(String(i + 1).padStart(2, '0'), 340, y + 66, { s: 40, f: F.mono, c: on ? C.gold : C.dim, a: ka, id: 'qn' + i });
      txt(q, 440, y + 64, { s: 44, w: 700, f: F.serif, a: ka, id: 'q' + i });
      const mk = st === 'solved' ? '解けた' : st === 'half' ? '半分' : '？', col = st === 'solved' ? C.teal : st === 'half' ? C.gold : C.dim; const sk = st === 'open' ? ka : ka * rise(u, (s.reveal === i ? .9 : .3));
      alpha(sk, () => box(1430, y + 18, 150, 52, col, 2, st === 'open' ? [6, 5] : null)); txt(mk, 1505, y + 56, { s: 28, w: 700, c: col, al: 'center', a: sk, id: 'st' + i }); });
  },
  bars(u, s, d) { backdrop(s.bg, u, d); kicker(s.kicker, 200, 230, rise(u, .1), C.gold, 'k');
    const mx = s.max || Math.max(...s.items.map(i => i.value)), X0 = 560, BW = 1100;
    s.items.forEach((it, i) => { const y = 340 + i * (s.gap || 150), kk = rise(u, .2 + i * .35, .7), w = BW * it.value / mx * kk, col = it.hi ? C.gold : it.col ? C[it.col] : C.faint;
      txt(it.label, X0 - 30, y + 46, { s: 34, w: 700, al: 'right', a: rise(u, .15 + i * .35), id: 'b' + i }); alpha(.9, () => fill(X0, y, w, 64, col));
      if (it.dashed) box(X0, y, BW * it.value / mx, 64, C.teal, 2, [8, 6]);
      txt(it.text, X0 + w + 24, y + 46, { s: 40, w: 700, f: F.serif, c: it.hi ? C.gold : C.text, a: rise(u, .5 + i * .35), id: 'v' + i }); });
    if (s.note) txt(s.note, 200, 900, { s: 22, c: C.dim, a: rise(u, .3), id: 'note' });
  },
  squares(u, s, d) { // areas to the same scale
    kicker(s.kicker, 200, 200, rise(u, .1), C.gold, 'k'); const mx = Math.max(...s.items.map(i => i.m2)), side = 520; let X = 200;
    s.items.forEach((it, i) => { const a = Math.sqrt(it.m2 / mx) * side, kk = rise(u, .2 + i * .4, .7), y = 820 - a;
      alpha(kk, () => { fill(X, y, a, a, it.hi ? 'rgba(200,162,78,.22)' : 'rgba(79,163,165,.12)'); box(X, y, a, a, it.hi ? C.gold : C.teal, 2, it.hi ? null : [8, 6]); });
      txt(it.label, X, 870, { s: 30, w: 700, a: kk, id: 'l' + i }); txt(it.text, X, 912, { s: 22, f: F.mono, c: it.hi ? C.gold : C.dim, a: kk, id: 't' + i }); X += Math.max(a, 300) + 90; });
    if (s.note) txt(s.note, W - 160, 200, { s: 22, c: C.dim, al: 'right', a: rise(u, .9), id: 'note' });
  },
  timeline(u, s, d) { backdrop(s.bg, u, d); const [a, b] = s.axis, AX = 200, AW = 1520, AY = 640, X = y => AX + (y - a) / (b - a) * AW;
    kicker(s.kicker, 200, 220, rise(u, .05), C.gold, 'k'); const ka = rise(u, 0, .5); alpha(ka, () => { line(AX, AY, AX + AW * ka, AY, C.dim, 1.5); for (let y = a; y <= b; y += s.step) line(X(y), AY - 8, X(y), AY + 8, C.faint, 1.5); });
    for (let y = a; y <= b; y += s.step) txt(String(y), X(y), AY + 42, { s: 20, f: F.mono, c: C.dim, al: 'center', a: ka, id: 'y' + y, pass: true });
    (s.spans || []).forEach((sp, i) => { const kk = rise(u, .3); alpha(kk * .85, () => fill(X(sp.from), AY - 14, X(sp.to) - X(sp.from), 28, sp.hi ? C.red : C.faint)); txt(sp.label, (X(sp.from) + X(sp.to)) / 2, AY + 90, { s: 24, c: C.text, al: 'center', a: kk, id: 'sp' + i }); });
    s.events.forEach((e, i) => { const kk = rise(u, .3 + i * .3), ex = X(e.y), up = (e.side || (i % 2 ? -1 : 1)) > 0, yy = up ? AY - 120 : AY + 160;
      line(ex, AY, ex, up ? AY - 90 : AY + 110, e.hi ? C.gold : C.dim, 1.5, e.hi ? null : [4, 4]); ring(ex, AY, 9, kk, e.hi ? C.gold : C.dim, 3);
      txt(e.label, ex, yy, { s: e.hi ? 40 : 30, w: 700, f: F.serif, c: e.hi ? C.gold : C.text, al: 'center', a: kk, id: 'e' + i }); if (e.sub) txt(e.sub, ex, yy + 36, { s: 20, f: F.mono, c: C.dim, al: 'center', a: kk, id: 'es' + i }); });
  },
  calc(u, s, d) { backdrop(s.bg, u, d); kicker(s.kicker || '計算', 300, 260, rise(u, .05), C.gold, 'k');
    s.rows.forEach((r, i) => { const y = 380 + i * 130, kk = rise(u, .2 + i * (s.dt || .8));
      txt(r[0], 300, y, { s: 46, w: 500, f: F.mono, c: C.text, a: kk, id: 'a' + i });
      if (r[1]) { const ka = rise(u, .45 + i * (s.dt || .8)); txt('=', 1110, y, { s: 46, f: F.mono, c: C.dim, a: ka }); txt(r[1], 1180, y, { s: 58, w: 700, f: F.serif, c: i === s.rows.length - 1 || r[2] ? C.gold : C.text, a: ka, id: 'r' + i }); } });
    if (s.note) txt(s.note, 300, 380 + s.rows.length * 130 + 10, { s: 24, c: C.dim, a: rise(u, .6), id: 'note' });
  },
