</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Long-form film in the "Lamplit Archive" style (my-styles/lamplit-archive). Canvas 2D, deterministic render(t).
// film.json (tools/build_timeline.py) holds every scene: one sentence, one layout, its parameters (scenes.json, written by
// Claude Code). assets.json places GSI images on the globe so scenes can name places by latitude/longitude.
// Palette, grades and motion come from film.json.style (= config/style.json). Primitives follow Lemo-Opuscar's
// Visual Investigation demo (MIT); the layouts are this style's own.
const W = 1920, H = 1080;
const cv = document.getElementById('c'), x0 = cv.getContext('2d');
let LAND = [], x = x0, FILM, S, C, G, M, A, FR = 0, REC = null, LAYER, TQ = null, GT = 0, GD = 1, LAST = [];   // TQ: text queued until after the lamp/exposure passes; GT/GD: time in the current shot
const F = { serif: 'SerifJP', sans: 'SansJP', mono: 'PlexMono, SansJP' };
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v)), seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = k => 1 - Math.pow(1 - k, 3), ss = k => k * k * (3 - 2 * k), eio = k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2, lerp = (a, b, k) => a + (b - a) * k;

const IM = {}; let GRAIN = [];
function load(src) { return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => { console.warn('missing', src); r(null); }; i.src = src; }); }
async function boot() {
  FILM = await (await fetch('film.json')).json(); A = await (await fetch('assets.json')).json(); window.DUR = FILM.dur;
  LAND = (await (await fetch('assets/land_eastasia.json')).json()).rings;   // Natural Earth 1:50m land (public domain), East Asia
  S = FILM.style; C = S.palette; G = S.grade; M = S.motion;
  const L = Object.entries(A).filter(([k, v]) => v.f).map(([k, v]) => load(v.f).then(i => IM[k] = i));
  for (const f of ['700 40px SerifJP', '500 40px SerifJP', '700 40px SansJP', '500 40px SansJP', '500 20px PlexMono']) L.push(document.fonts.load(f));
  await Promise.all(L);
  for (let g = 0; g < 6; g++) { const c = document.createElement('canvas'); c.width = c.height = 256; const gx = c.getContext('2d'); const d = gx.createImageData(256, 256); const r = rnd(g * 131 + 5);
    for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() + r() - 1.5) * 110; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } gx.putImageData(d, 0, 0); GRAIN.push(c); }

  LAYER = [mk(), mk()]; window.READY = true;
}
function mk() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }

// ── geography: lat/lon → source pixel of an asset ──
function geo(k, ll) { const a = A[k]; if (!Array.isArray(ll)) return [a.w / 2, a.h / 2]; if (ll.length === 3) return [ll[0], ll[1]];
  const n = 2 ** a.z, fx = (ll[1] + 180) / 360 * n * 256, la = ll[0] * Math.PI / 180, fy = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n * 256; return [fx - a.gx0, fy - a.gy0]; }
const gradeOf = k => { const l = A[k].layer; return l === 'seamlessphoto' ? G.photo : l === 'hillshademap' ? G.terrain : G.old_photo; };

// ── primitives ──
const PX = o => o.raw ? (o.s || 24) : Math.round(Math.max(S.type.text_min_px || 0, (o.s || 24) * (S.type.text_scale || 1)));   // type.text_scale / text_min_px (config/style.json): every on-screen text size, subtitles excepted
function font(o) { return `${o.w || 500} ${PX(o)}px ${o.f || F.sans}`; }
function txt(s, X, Y, o = {}) {   // text is queued (TQ) and drawn after the lamp, vignette and exposure passes, so the vignette never dims it

  if (vis > .001) { if (TQ) TQ.push([s, X, Y, o, vis]); else drawT(x, s, X, Y, o, vis); }

}
function drawT(c, s, X, Y, o, a) { c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.filter = 'none'; c.font = font(o); c.fillStyle = o.c || C.text; c.globalAlpha = Math.min(1, a); c.textAlign = o.al || 'left'; c.textBaseline = 'alphabetic'; c.letterSpacing = (o.ls || 0) + 'px';
  if (o.shadow) { c.shadowColor = 'rgba(0,0,0,.9)'; c.shadowBlur = o.shadow; } else if (!/^#[0-3]/.test(o.c || '')) { c.shadowColor = 'rgba(8,7,6,.75)'; c.shadowBlur = 8; }
  c.fillText(s, X, Y); c.restore(); }
const tkey = q => q[0] + '|' + Math.round(q[1]) + '|' + Math.round(q[2]) + '|' + (q[3].c || '') + '|' + PX(q[3]);
function tw(s, o = {}) { x.save(); x.font = font(o); x.letterSpacing = (o.ls || 0) + 'px'; const w = x.measureText(String(s)).width; x.restore(); return w; }
function line(a, b, c, d, col, w = 1, dash) { x.save(); x.strokeStyle = col; x.lineWidth = w; if (dash) x.setLineDash(dash); x.beginPath(); x.moveTo(a, b); x.lineTo(c, d); x.stroke(); x.restore(); }
function fill(X, Y, w, h, c) { x.fillStyle = c; x.fillRect(X, Y, w, h); }
function box(X, Y, w, h, col, lw = 1.5, dash) { x.save(); x.strokeStyle = col; x.lineWidth = lw; if (dash) x.setLineDash(dash); x.strokeRect(X + .5, Y + .5, w - 1, h - 1); x.restore(); }

function view(k, f, scale, o = {}) { // camera on one asset; returns source px → screen

  const map = (px, py) => [cx + (px - f[0]) * scale, cy + (py - f[1]) * scale];
  x.save(); x.beginPath(); x.rect(X, Y, w, h); x.clip(); fill(X, Y, w, h, C.ground);
  if (img) { x.globalAlpha *= (o.a ?? 1); x.filter = gradeOf(k); const [sx, sy] = map(0, 0); x.drawImage(img, sx, sy, img.width * scale, img.height * scale); x.filter = 'none'; }

}
function scaleFor(k, span, w = W) { return w * A[k].mpp / span; } // span = metres across the frame

  const v = x.createRadialGradient(W / 2, H * .46, H * .16, W / 2, H * .5, H * .95); v.addColorStop(0, 'rgba(13,12,11,0)'); v.addColorStop(1, `rgba(13,12,11,${G.vignette_edge_alpha})`); x.fillStyle = v; x.fillRect(0, 0, W, H);

const rise = (u, at, dur = .45) => eo(seg(u, at, at + dur));

  const t = s.text || {}; let y = t.y || 330; const k = rise(u, .1);
  const Z = S.type.text_scale || 1, NS = PX({ s: t.ns || 120 });
  if (t.kicker) { kicker(t.kicker, 120, y - (t.title ? PX({ s: t.ts || 92 }) + 14 : 70 * Z), k, t.kc ? C[t.kc] : C.red, 'k'); }
  if (t.title) { txt(t.title, 116, y + 10 * (1 - k), { s: t.ts || 92, w: 700, f: F.serif, a: k, id: 'tt' }); line(120, y + 36, lerp(120, 120 + Math.min(520, tw(t.title, { s: t.ts || 92, w: 700, f: F.serif })), rise(u, .3, .6)), y + 36, C.red, 2); y += 140 * Z; }
  if (t.caption) { txt(t.caption, 120, y, { s: 28, c: C.dim, a: rise(u, .35), id: 'cap' }); y += 36 + NS * .9; }
  if (t.number) { const kk = rise(u, .45); if (t.kicker && !t.title && !t.caption) y = Math.max(y, (t.y || 330) - 40 * Z + NS * .82); const nw = txt(t.number, 114, y + 8 * (1 - kk), { s: t.ns || 120, w: 700, f: F.serif, c: C.gold, a: kk, id: 'num' }); if (t.unit) txt(t.unit, 126 + nw, y, { s: 44, f: F.mono, c: C.gold, a: kk, id: 'unit' }); y += 90 * Z; }

}

// Daisen keyhole, traced on daisen_z17 source pixels (schematic, see FACTS.md)
const DAISEN = [[1370, 975], [1430, 950], [1500, 955], [1560, 1000], [1595, 1070], [1595, 1160], [1560, 1230], [1510, 1280], [1470, 1320], [1445, 1400], [1440, 1475], [1150, 1325], [1200, 1290], [1260, 1240], [1300, 1170], [1320, 1080], [1340, 1020]];

// ── layouts ──
const L = {
  photo(u, s, d) { // a camera on a map or photograph; rings, outline and a text column
    const g0 = s.g ? s.g.first : s, g1 = s.g ? s.g.last : s;   // one camera move across a shot of several sentences
    const k = s.img, f0 = geo(k, g0.at), f1 = geo(k, g1.to || g1.at), p = ss(seg(GT, 0, GD + .7));
    const sp = [(g0.span || [1500, 1400])[0], (g1.span || [1500, 1400])[1]], sc = scaleFor(k, lerp(sp[0], sp[1], p)), f = [lerp(f0[0], f1[0], p), lerp(f0[1], f1[1], p)];

    if (s.outline) { const kk = eio(seg(u, .5, 2.2)); if (kk > 0) { x.save(); x.strokeStyle = C.teal; x.lineWidth = 3; const pts = DAISEN.map(p => mp(p[0], p[1])); const n = Math.max(2, Math.floor((pts.length + 1) * kk));
      x.beginPath(); x.moveTo(...pts[0]); for (let i = 1; i < n; i++) x.lineTo(...pts[i % pts.length]); x.stroke(); x.restore(); } }
    (s.rings || []).forEach((r, i) => { const [cx, cy] = mp(...geo(k, r.at)); const rad = r.m ? r.m / A[k].mpp * sc : (r.r || 30); const kk = seg(u, .2 + i * .3, .8 + i * .3);
      ring(cx, cy, rad, kk, r.col ? C[r.col] : C.red, 2.5, r.dashed ? [8, 6] : null); if (!r.label) return; const ka = rise(u, .35 + i * .3); const side = r.side || 1, lx = cx + side * (rad + 18);
      txt(r.label, lx, cy - 4, { s: r.ls || 34, w: 700, f: F.serif, al: side > 0 ? 'left' : 'right', a: ka, shadow: 10, id: 'r' + i });
      if (r.sub) txt(r.sub, lx, cy + 30, { s: 21, f: F.mono, c: C.dim, al: side > 0 ? 'left' : 'right', a: ka, shadow: 8, id: 'rs' + i, pass: true }); });
    if (s.scale) { const m = s.scale, len = m / A[k].mpp * sc, ka = rise(u, .4); alpha(ka, () => { line(W - 120 - len, 880, W - 120, 880, C.dim, 2); line(W - 120 - len, 872, W - 120 - len, 888, C.dim, 2); line(W - 120, 872, W - 120, 888, C.dim, 2); });
      txt(m >= 1000 ? `${m / 1000} km` : `${m} m`, W - 120, 862, { s: 20, f: F.mono, c: C.dim, al: 'right', a: ka, id: 'sc', pass: true }); }
    if (s.stamp) { const ka = rise(u, .2); alpha(ka, () => box(W - 470, 96, 350, 54, C.gold, 1.5, [6, 5])); txt(s.stamp, W - 295, 132, { s: 24, f: F.mono, c: C.gold, al: 'center', a: ka, id: 'stamp' }); }
    title(s, u);
  },
  card(u, s, d) { backdrop(s.bg, u, d); const k = rise(u, .05, .4), al = s.center ? 'center' : 'left', X = s.center ? W / 2 : 200;
    const lines = Array.isArray(s.lines) ? s.lines : [s.lines]; const fs = s.fs || (lines.length > 1 ? 76 : 92);
    if (s.kicker) kicker(s.kicker, s.center ? W / 2 - tw(s.kicker, { s: 24, f: F.mono, ls: 2 }) / 2 - 8 : 204, Math.min(400, 520 - PX({ s: fs }) * .88 - 44), k, C.red, 'k');
    lines.forEach((ln, i) => txt(ln, X, 520 + i * fs * 1.35 - 14 * (1 - k), { s: fs, w: 700, f: F.serif, al, a: rise(u, .05 + i * .1, .4), c: s.gold === i ? C.gold : C.text, id: 'l' + i }));
    const yr = 520 + (lines.length - 1) * fs * 1.35 + 50; if (!s.center) line(204, yr, lerp(204, 520, rise(u, .6, .8)), yr, C.red, 2);
    if (s.sub) txt(s.sub, X, yr + 70, { s: 28, c: C.dim, al, a: rise(u, .25), id: 'sub' });
  },
  chapter(u, s, d) { backdrop(s.bg, u, d); const k = rise(u, .1, .6);
    txt(FILM.chapter_label || 'MYSTERY', 200, 470 - PX({ s: 150 }) * .88 - 32, { s: 24, f: F.mono, c: C.red, ls: 6, a: k, id: 'm' }); txt(s.num, 200, 470, { s: 150, w: 700, f: F.serif, c: C.gold, a: k, id: 'n' });
    txt(s.title, 200 + tw(s.num, { s: 150, w: 700, f: F.serif }) + 50, 455 - 12 * (1 - k), { s: 84, w: 700, f: F.serif, a: rise(u, .05, .4), id: 't' });

      txt(String(i + 1).padStart(2, '0'), 340, y + 66, { s: 40, f: F.mono, c: on ? C.gold : C.dim, a: ka, id: 'qn' + i });
      txt(q, 440, y + 64, { s: 44, w: 700, f: F.serif, a: ka, id: 'q' + i });
      const mk = (s.marks || [])[i] || (st === 'solved' ? (B.solved || '解けた') : st === 'half' ? '半分' : '？'), col = st === 'solved' ? C.teal : st === 'half' ? C.gold : C.dim; const sk = st === 'open' ? ka : ka * rise(u, (s.reveal === i ? .9 : .3));

      txt(it.label, X, 870, { s: 30, w: 700, a: kk, id: 'l' + i }); txt(it.text, X, 912, { s: 22, f: F.mono, c: it.hi ? C.gold : C.dim, a: kk, id: 't' + i }); X += Math.max(a, 300) + 90; });

  timeline(u, s, d) { backdrop(s.bg, u, d); const [a, b] = s.axis, AX = 200, AW = 1520, AY = 640, X = y => AX + (y - a) / (b - a) * AW;
    kicker(s.kicker, 200, 220, rise(u, .05), C.gold, 'k'); const ka = rise(u, 0, .5); alpha(ka, () => { line(AX, AY, AX + AW * ka, AY, C.dim, 1.5); for (let y = a; y <= b; y += s.step) line(X(y), AY - 8, X(y), AY + 8, C.faint, 1.5); });
